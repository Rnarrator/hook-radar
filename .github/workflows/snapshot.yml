# Hook Radar Auto Snapshot: collect a fresh sample, build the site and publish it
# to GitHub Pages about every hour. No computer of yours needs to be on.
#
# How the rhythm is kept. GitHub starts scheduled workflows late, or not at all,
# when it is busy (its documentation says so; in the first day of this repository
# two of seven slots produced a run). So three triggers an hour are offered, and
# the first job, "Is a new snapshot due", lets only one of them collect: it
# reads when the last snapshot was saved and stops the run, successfully and
# before any data provider is contacted, when that was under 45 minutes ago, or
# when a run failed under 90 minutes ago (a refused run is not repeated at once).
# A saved time that cannot be read, or is in the future, means collect.
# Pressing "Run workflow" collects at once, because "force" is ticked by
# default. With "force" unticked a run started by hand, or by a call to GitHub's
# API, is treated exactly like a scheduled run: the same 45 minutes, the same 90
# minutes after a failure, the same rule for new pools.
#
# GitHub's own schedule is best effort (its documentation says a scheduled run can
# be delayed or dropped under load; from 17:07 UTC on 11 Nov to 02:32 UTC on 12 Nov
# 2026 none was started, 9 h 25 min). That is why an external timer is
# recommended: it asks GitHub for a run every 20 minutes with force and discover
# both set to "false", and this gate decides. Nearly every such call ends green
# in seconds with "Nothing to do". The timer only asks;
# docs/EXTERNAL-TRIGGER.md explains how to set it up.
#
# What a run asks DEX Screener about. The collector does not ask about every known
# pool in every run: it asks about the pools that answered in the last three days
# and the pools first seen in the last three days every time, and about the others
# in turn (every 3, 6 or 12 hours, by how long ago they last answered). A run after
# a long gap asks about what fell due in the gap. If that plan misbehaves, the
# repository variable COLLECTOR_FULL_PLAN=true (see the Collect step) returns to
# asking about every known pool, and the collector does so by itself when the
# lanes would ask about too few pools or too many, or the planner fails (it says
# so in status.json and in the run's annotations). A run with the lanes is also
# refused when DEX Screener did not answer for a larger network (a failed run is
# not repeated for 90 minutes, so a short failure of one large network can cost one
# or two snapshots: deliberate, see docs/COLLECTOR-NOTES.md). The step
# "Collect the snapshot" prints which plan ran. A DEX Screener batch that failed with
# an error that may be gone a moment later is asked again once (at most 8 a run);
# the repository variable COLLECTOR_RETRY_MAX_BATCHES can lower that, and 0 switches
# it off.
#
# Looking for new pools reads the slow providers, so a scheduled run does it
# only when the last snapshot was saved in an earlier three-hour block of the
# UTC day than the present one (the blocks the collector rotates its discovery
# pages by); every other run measures the pools already known. A run started
# by hand with "force" ticked looks for new pools only when "discover" is
# ticked. With "force" unticked it follows the block rule like a scheduled run,
# and a ticked "discover" still makes it look.
#
# The last step of a collecting run reads, at most twice a day per pool, the daily
# volume of the largest pools (7D and 30D) from GeckoTerminal: up to 20 requests,
# after everything else, on the same paced lane and inside the 399-request cap. It
# never fails a run; the repository variable COLLECTOR_DAILY_MAX_REQUESTS (see the
# Collect step) can lower it, and 0 switches it off.
#
# The safeguard that matters most: the deploy job needs the collect job. If the
# collector refuses to publish (too few pools with a current volume, a provider
# refused us, a validator failed) the collect job fails, nothing is deployed and
# the site keeps showing the last good snapshot, still dated.

name: Snapshot

on:
  schedule:
    # Three triggers an hour at off-peak minutes (UTC), so that when GitHub drops
    # or delays one, another may still arrive. The first job decides whether a
    # trigger collects; most of them end there after a few seconds.
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect now even if the last snapshot is under 45 minutes old. Untick it to be treated like a scheduled run (the 45 minute and 90 minute rules apply)"
        type: boolean
        default: true
      discover:
        description: "Also look for new pools (about 60 extra requests to the v4.xyz indexer). Left unticked with force ticked, only known pools are measured. Left unticked with force unticked, the three-hour rule decides"
        type: boolean
        default: false

# One run at a time. A run that starts while another is going waits for it.
concurrency:
  group: hook-radar-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs first, costs about fifteen seconds, contacts no data provider. When it says
  # "not due" the collect and deploy jobs are skipped: the run is green, nothing
  # is published and the site keeps its snapshot. A skipped collect skips deploy
  # too (a job that needs a skipped job is skipped), so "deploy needs collect"
  # still holds exactly as before.
  gate:
    name: Is a new snapshot due
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      due: ${{ steps.decide.outputs.due }}
      max_discovery: ${{ steps.decide.outputs.max_discovery }}
    steps:
      # The tip of the branch as it is now, not the commit that started the run:
      # a run that waited behind another one must see that run's saved state.
      - name: Check out the saved state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: state

      # The saved time is read as JSON by Node (the same major version as the
      # collection), not with grep: spaces, line ends and a pool whose name holds
      # the word updatedAt cannot be mistaken for it. The image's own Node is not
      # relied on.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          DISCOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.discover }}
          MIN_AGE_MINUTES: "45"
          RETRY_AFTER_FAILURE_MINUTES: "90"
        run: |
          set -u
          now=$(date -u +%s)
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          # When the last good run saved its snapshot, in seconds since 1970; empty
          # when the file or its time cannot be read (missing, null, not a date,
          # a date that does not exist such as 30 February).
          last=$(node -e '
            const { readFileSync } = require("node:fs");
            try {
              const text = readFileSync("state/pools.json", "utf8").replace(/^\uFEFF/, "");
              const stamp = JSON.parse(text).updatedAt;
              if (typeof stamp !== "string") process.exit(0);
              if (!/^20\d\d-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d+)?Z$/.test(stamp)) process.exit(0);
              const ms = Date.parse(stamp);
              if (!Number.isFinite(ms)) process.exit(0);
              if (new Date(ms).toISOString().slice(0, 19) !== stamp.slice(0, 19)) process.exit(0);
              console.log(Math.floor(ms / 1000));
            } catch {}
          ' 2>/dev/null) || last=""
          case "${last}" in
            ""|*[!0-9]*) last="" ;;
          esac

          # Looking for new pools reads the slow providers (GeckoTerminal pages and
          # the v4.xyz indexer). A scheduled run does it when the last snapshot was
          # saved in an earlier three-hour block than now, so at most once per block (a
          # run that starts in one block and ends in the next leaves that next block
          # without a search); the blocks are the ones the collector
          # rotates its discovery pages by (RUN_SLOT_MS in collector/run.mjs). A
          # run started by hand does it when "discover" is ticked, and, with
          # "force" ticked, only then. With "force" unticked (what the external
          # timer sends, with "discover" unticked too) it follows the same block
          # rule as a scheduled run. Every other run measures the pools already
          # known.
          block=10800
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISCOVER}" = "true" ]; then
            discover=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${FORCE}" = "true" ]; then
            discover=false
          elif [ -n "${last}" ] && [ "${last}" -le "${now}" ] && [ $((last / block)) -eq $((now / block)) ]; then
            discover=false
          else
            discover=true
          fi
          if [ "${discover}" = "true" ]; then
            echo "max_discovery=" >> "$GITHUB_OUTPUT"
          else
            echo "max_discovery=0" >> "$GITHUB_OUTPUT"
          fi

          due() {
            echo "due=true" >> "$GITHUB_OUTPUT"
            say "Collecting: $*"
            if [ "${discover}" = "true" ]; then
              say "This run also looks for new pools."
            else
              say "This run measures the pools already known."
            fi
            exit 0
          }
          skip() { echo "due=false" >> "$GITHUB_OUTPUT"; say "Nothing to do: $*"; exit 0; }

          [ "${FORCE}" = "true" ] && due "started by hand with force ticked"

          # pools.json is committed before the site is deployed and never on a
          # failed run, so its time is when the last good snapshot was saved.
          if [ -z "${last}" ]; then
            reason="the saved time of the last snapshot cannot be read"
          elif [ "${last}" -gt "${now}" ]; then
            reason="the saved time of the last snapshot is in the future"
          else
            age=$(( (now - last) / 60 ))
            [ "${age}" -ge "${MIN_AGE_MINUTES}" ] || skip "the last snapshot is ${age} minutes old (a new one is collected from ${MIN_AGE_MINUTES} minutes)"
            reason="the last snapshot is ${age} minutes old"
          fi

          # A refused run is not repeated at once. The runs that stopped here are
          # successful ones, so only a run that failed or ran out of time counts. If
          # GitHub cannot be asked, collect.
          newest=""
          for outcome in failure timed_out; do
            when=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/snapshot.yml/runs?status=${outcome}&per_page=1" --jq '.workflow_runs[0].updated_at // empty' 2>/dev/null) || when=""
            [ -n "${when}" ] || continue
            seconds=$(date -u -d "${when}" +%s 2>/dev/null) || continue
            case "${seconds}" in ""|*[!0-9]*) continue ;; esac
            if [ -z "${newest}" ] || [ "${seconds}" -gt "${newest}" ]; then newest="${seconds}"; fi
          done
          # A failure that a later snapshot has followed no longer counts: the
          # collection works again.
          if [ -n "${newest}" ] && { [ -z "${last}" ] || [ "${newest}" -gt "${last}" ]; }; then
            since=$(( (now - newest) / 60 ))
            if [ "${since}" -ge 0 ] && [ "${since}" -lt "${RETRY_AFTER_FAILURE_MINUTES}" ]; then
              skip "the last run failed ${since} minutes ago (collecting is tried again from ${RETRY_AFTER_FAILURE_MINUTES} minutes)"
            fi
          fi
          due "${reason}"

  collect:
    name: Collect and build
    needs: gate
    if: ${{ needs.gate.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Fails early, before any data provider is contacted, when GitHub Pages
      # has not been switched on (Settings, Pages, Source: GitHub Actions).
      - name: Check that GitHub Pages is switched on
        uses: actions/configure-pages@v5

      - name: Work out where the site will be served
        id: site
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          lower_repo="$(printf '%s' "${repo}" | tr '[:upper:]' '[:lower:]')"
          cname=""
          if [ -f public/CNAME ]; then cname="public/CNAME"; elif [ -f CNAME ]; then cname="CNAME"; fi
          # A file such as CNAME.txt (Notepad and File Explorer on Windows add the
          # .txt) or cname is not read: say so instead of building for the wrong
          # address and publishing a blank page on the custom domain.
          if [ -z "${cname}" ]; then
            for stray in ./* ./public/*; do
              [ -f "${stray}" ] || continue
              case "$(basename "${stray}" | tr '[:upper:]' '[:lower:]')" in
                cname|cname.*)
                  echo "::error::${stray#./} is not read. The custom-domain file must be named exactly public/CNAME (capital letters, no .txt). Rename it, or remove it if you do not use a custom domain."
                  exit 1 ;;
              esac
            done
          fi
          if [ -n "${cname}" ]; then
            domain="$(head -n 1 "${cname}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            case "${domain}" in
              ""|*[!a-z0-9.-]*) echo "::error::${cname} must contain one domain name such as www.example.com"; exit 1 ;;
            esac
            echo "base=./" >> "${GITHUB_OUTPUT}"
            echo "url=https://${domain}/" >> "${GITHUB_OUTPUT}"
          elif [ "${lower_repo}" = "${owner}.github.io" ]; then
            echo "base=/" >> "${GITHUB_OUTPUT}"
            echo "url=https://${owner}.github.io/" >> "${GITHUB_OUTPUT}"
          else
            echo "base=/${repo}/" >> "${GITHUB_OUTPUT}"
            echo "url=https://${owner}.github.io/${repo}/" >> "${GITHUB_OUTPUT}"
          fi

      # Exits non-zero when it will not publish. Nothing below runs then.
      - name: Collect the snapshot
        env:
          # Empty: look for new pools too. 0: measure the known pools only. The
          # collector reads it like --max-discovery and can only lower discovery.
          COLLECTOR_MAX_DISCOVERY: ${{ needs.gate.outputs.max_discovery }}
          # The way back. Create the repository variable COLLECTOR_FULL_PLAN with
          # the value true (Settings, Secrets and variables, Actions, Variables)
          # and the next run asks DEX Screener about every known pool, as the
          # collector did before the lane plan. It is the larger of the two plans
          # and inside the same 399-request ceiling; delete the variable to go back
          # to the lanes. Unset or empty changes nothing. The collector reads it
          # like --full-plan: it returns the run to its earlier size and no further.
          COLLECTOR_FULL_PLAN: ${{ vars.COLLECTOR_FULL_PLAN }}
          # The way back from the retry of a failed DEX Screener batch (at most 8 a
          # run). Create the repository variable COLLECTOR_RETRY_MAX_BATCHES with a
          # whole number from 0 to 8: it can only lower the 8, and 0 switches the retry
          # off. Unset, empty or anything else changes nothing.
          COLLECTOR_RETRY_MAX_BATCHES: ${{ vars.COLLECTOR_RETRY_MAX_BATCHES }}
          # The way back from the 7D and 30D step (at most 20 GeckoTerminal requests, the
          # last thing a run does). Create the repository variable
          # COLLECTOR_DAILY_MAX_REQUESTS with a whole number from 0 to 20: it can only
          # lower the 20, and 0 switches the step off. Unset, empty or anything else
          # changes nothing.
          COLLECTOR_DAILY_MAX_REQUESTS: ${{ vars.COLLECTOR_DAILY_MAX_REQUESTS }}
        run: node collector/run.mjs

      - name: Build the site
        run: npm run build:static -- --require-data
        env:
          VITE_BASE: ${{ steps.site.outputs.base }}
          VITE_SITE_URL: ${{ steps.site.outputs.url }}

      # The last gate, run on the files that will be published: refuses data
      # that is missing a snapshot, was made by an offline fixture replay, or
      # whose files come from different runs.
      - name: Check that the data is a live snapshot
        run: node scripts/check-edition-data.mjs dist/data

      # Only state/ is committed (known pools, history, the registry copy).
      # [skip ci] keeps this commit from starting the checks workflow.
      - name: Save state
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "state/ is unchanged"
            exit 0
          fi
          git commit -m "Update snapshot state [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push state/ after three attempts"
          exit 1

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Optional. Set the repository variable PUBLISH_SITE_BRANCH to true to
      # also keep the finished site, built to work at any address, on a branch
      # named "site" that Vercel, Cloudflare Pages or similar hosts can serve
      # without building. A failure here does not stop the GitHub Pages deploy.
      # The repository variable SITE_URL (the address of that other host, for the
      # link-preview picture) is read here; unset, it is empty and no picture is
      # added. A SITE_URL the build would refuse (typed without https://, for
      # example) must not leave the site branch stale with the run still green:
      # the picture is left out and a warning names the variable. The test is
      # the same one vite.config.ts applies (editionSiteUrl).
      - name: Mirror build for other hosts
        id: mirror-build
        if: ${{ vars.PUBLISH_SITE_BRANCH == 'true' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -eu
          site_url="${SITE_URL:-}"
          if [ -n "${site_url}" ] && ! node -e '
            try {
              const u = new URL(process.argv[1]);
              if (u.protocol !== "https:" || u.username || u.password || u.search || u.hash) process.exit(1);
            } catch {
              process.exit(1);
            }
          ' "${site_url}"; then
            echo "::warning::The repository variable SITE_URL is not used: it must be a full address that starts with https:// and has nothing after a ? or #. The site branch is updated without the link-preview picture. Correct SITE_URL and run Snapshot again."
            site_url=""
          fi
          VITE_SITE_URL="${site_url}" npm run build:static -- --require-data --outDir site-mirror

      - name: Mirror to the site branch
        if: ${{ vars.PUBLISH_SITE_BRANCH == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd site-mirror
          git init -q
          git checkout -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from run ${GITHUB_RUN_ID}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

  deploy:
    name: Publish to GitHub Pages
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
